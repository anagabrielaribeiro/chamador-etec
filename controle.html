<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle ETEC</title>
    <style>
        /* MODO ESCURO */
        body { background-color: #1a1a1a; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #eee; }
        
        /* Cartão Central Cinza Escuro */
        .control-panel { background: #2d2d2d; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 85%; max-width: 380px; border: 1px solid #444; }
        
        .logo-top { height: 60px; margin-bottom: 20px; }
        
        .section { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #444; }
        .section:last-child { border: none; margin: 0; padding: 0; }
        
        .label { font-size: 13px; text-transform: uppercase; color: #aaa; margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .numero-display { font-size: 36px; font-weight: bold; color: #fff; margin-bottom: 15px; display: block; }
        
        .btn-call { width: 100%; padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .btn-call:active { transform: scale(0.98); }
        .btn-blue { background-color: #0056b3; }
        .btn-red { background-color: #c62828; }
        
        .status { font-size: 11px; color: #00e676; margin-bottom: 15px; display: block; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
</head>
<body>

    <div class="control-panel">
        <img src="img/etecpv.png" alt="Logo" class="logo-top">
        
        <div class="status">● CONECTADO AO PAINEL</div>

        <div class="section">
            <span class="label">Atual Normal</span>
            <span id="displayNormal" class="numero-display">...</span>
            <button class="btn-call btn-blue" onclick="proximo('normal')">
                PRÓXIMO NORMAL
            </button>
        </div>

        <div class="section">
            <span class="label">Atual Preferencial</span>
            <span id="displayPref" class="numero-display">...</span>
            <button class="btn-call btn-red" onclick="proximo('preferencial')">
                PRÓXIMO PREFERENCIAL
            </button>
        </div>
    </div>

    <script>
        let vNorm = 0, vPref = 0;

        db.ref('senhas').on('value', (snap) => {
            const d = snap.val() || {};
            vNorm = d.normal || 0;
            vPref = d.preferencial || 0;
            document.getElementById('displayNormal').innerText = vNorm;
            document.getElementById('displayPref').innerText = vPref;
        });

        function proximo(tipo) {
            const novo = (tipo === 'normal' ? vNorm : vPref) + 1;
            db.ref('senhas/' + tipo).set(novo);
            // Pequena vibração no celular ao clicar (feedback tátil)
            if(navigator.vibrate) navigator.vibrate(50);
        }
    </script>
</body>
</html>
