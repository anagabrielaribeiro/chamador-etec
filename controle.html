<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Simplificado</title>
    <style>
        body { background-color: #e9ecef; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .control-panel { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        
        h2 { color: #b11116; margin-top: 0; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        
        .section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        
        .label { font-weight: bold; color: #555; font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 10px; }
        
        /* O número atual é apenas visualização agora */
        .numero-atual { font-size: 40px; font-weight: bold; color: #333; margin-bottom: 15px; display: block; }
        
        .btn-call { width: 100%; padding: 20px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-call:active { transform: scale(0.96); }
        
        .btn-blue { background-color: #0056b3; }
        .btn-red { background-color: #d32f2f; }

        .status { font-size: 12px; color: green; margin-bottom: 20px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
</head>
<body>

    <div class="control-panel">
        <h2>Controle ETEC</h2>
        <div class="status">● Sistema Conectado</div>

        <div class="section">
            <span class="label">Última Normal Chamada</span>
            <span id="displayNormal" class="numero-atual">...</span>
            <button class="btn-call btn-blue" onclick="proximo('normal')">
                Chamar Próximo Normal
            </button>
        </div>

        <div class="section">
            <span class="label">Última Preferencial Chamada</span>
            <span id="displayPref" class="numero-atual">...</span>
            <button class="btn-call btn-red" onclick="proximo('preferencial')">
                Chamar Próximo Pref.
            </button>
        </div>
    </div>

    <script>
        // Variáveis para guardar o valor atual
        let valorNormal = 0;
        let valorPref = 0;

        // 1. Ouve o banco de dados para saber em qual número parou
        db.ref('senhas').on('value', (snap) => {
            const dados = snap.val() || {};
            valorNormal = dados.normal || 0;
            valorPref = dados.preferencial || 0;
            
            // Atualiza a tela do operador
            document.getElementById('displayNormal').innerText = valorNormal;
            document.getElementById('displayPref').innerText = valorPref;
        });

        // 2. Função inteligente: Pega o atual e soma +1
        function proximo(tipo) {
            if (tipo === 'normal') {
                const novo = valorNormal + 1;
                db.ref('senhas/normal').set(novo);
            } else {
                const novo = valorPref + 1;
                db.ref('senhas/preferencial').set(novo);
            }
        }
    </script>
</body>
</html>
