<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle ETEC</title>
    <style>
        /* VARIÁVEIS DE CORES (TEMA) */
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #eee;
            --label-color: #aaa;
            --border-color: #444;
            --shadow: rgba(0,0,0,0.5);
        }

        /* CLASSE DO TEMA CLARO */
        body.light-theme {
            --bg-color: #e9ecef;
            --card-bg: #ffffff;
            --text-color: #333;
            --label-color: #666;
            --border-color: #ddd;
            --shadow: rgba(0,0,0,0.1);
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; transition: background 0.3s; }
        
        .control-panel { background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px var(--shadow); text-align: center; width: 85%; max-width: 380px; border: 1px solid var(--border-color); position: relative; }
        
        .logo-top { height: 60px; margin-bottom: 20px; }
        
        /* Botão de Tema */
        .theme-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; font-size: 24px; color: var(--text-color); }

        .section { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid var(--border-color); }
        .section:last-child { border: none; margin: 0; padding: 0; }
        
        .label { font-size: 13px; text-transform: uppercase; color: var(--label-color); margin-bottom: 5px; display: block; letter-spacing: 1px; }
        .numero-display { font-size: 36px; font-weight: bold; margin-bottom: 15px; display: block; }
        
        .btn-call { width: 100%; padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; box-shadow: 0 4px 6px var(--shadow); }
        .btn-call:active { transform: scale(0.98); }
        .btn-blue { background-color: #0056b3; }
        .btn-red { background-color: #c62828; }
        
        .status { font-size: 11px; color: #00e676; margin-bottom: 15px; display: block; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
</head>
<body>

    <div class="control-panel">
        <button class="theme-btn" onclick="toggleTheme()" title="Mudar Tema">🌓</button>
        <img src="img/etecpv.png" alt="Logo" class="logo-top">
        
        <div class="status">● CONECTADO</div>

        <div class="section">
            <span class="label">Atual Normal</span>
            <span id="displayNormal" class="numero-display">...</span>
            <button class="btn-call btn-blue" onclick="proximo('normal')">PRÓXIMO NORMAL</button>
        </div>

        <div class="section">
            <span class="label">Atual Preferencial</span>
            <span id="displayPref" class="numero-display">...</span>
            <button class="btn-call btn-red" onclick="proximo('preferencial')">PRÓXIMO PREF.</button>
        </div>
    </div>

    <script>
        // Lógica de Tema
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            // Salva a escolha no navegador
            if(document.body.classList.contains('light-theme')) {
                localStorage.setItem('tema', 'light');
            } else {
                localStorage.setItem('tema', 'dark');
            }
        }

        // Carrega o tema salvo ao abrir
        if(localStorage.getItem('tema') === 'light') {
            document.body.classList.add('light-theme');
        }

        // Lógica Firebase
        let vNorm = 0, vPref = 0;
        db.ref('senhas').on('value', (snap) => {
            const d = snap.val() || {};
            vNorm = d.normal || 0;
            vPref = d.preferencial || 0;
            document.getElementById('displayNormal').innerText = vNorm;
            document.getElementById('displayPref').innerText = vPref;
        });

        function proximo(tipo) {
            const novo = (tipo === 'normal' ? vNorm : vPref) + 1;
            db.ref('senhas/' + tipo).set(novo);
            if(navigator.vibrate) navigator.vibrate(50);
        }
    </script>
</body>
</html>
