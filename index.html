<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DE SENHAS - ETEC</title>
    <style>
        /* CSS LIMPO E MODERNO */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background-color: white; height: 120px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 6px solid #b11116; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-img { height: 80px; width: auto; }
        .cabecalho-texto { text-align: right; }
        .titulo { display: block; color: #b11116; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .subtitulo { display: block; color: #666; font-size: 18px; font-weight: bold; margin-top: 5px; }

        main { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 20px 40px; }

        .card { flex: 1; height: 80%; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; box-shadow: 0 15px 30px rgba(0,0,0,0.3); border: 6px solid transparent; transition: all 0.5s ease; opacity: 0.6; transform: scale(0.95); }
        .bg-azul { background: linear-gradient(135deg, #0056b3 0%, #004494 100%); }
        .bg-vermelho { background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); }

        .card.destaque { opacity: 1; transform: scale(1.05); border-color: #ffd700; box-shadow: 0 0 50px rgba(0,0,0,0.5); z-index: 5; }
        .card-titulo { font-size: 3vw; font-weight: 900; margin-bottom: 10px; }
        .card-numero { font-size: 14vw; font-weight: 900; line-height: 1; text-shadow: 4px 4px 10px rgba(0,0,0,0.4); }

        /* NOVO RODAPÉ DUPLO */
        .footer-container { background: #ddd; display: flex; flex-direction: column; }
        
        .historico-bar { background: #333; color: #ffd700; text-align: center; padding: 5px; font-size: 18px; font-weight: bold; font-family: monospace; }
        
        .footer-msg { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #555; text-transform: uppercase; letter-spacing: 2px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <header>
        <img src="img/etecpv.png" alt="Logo" class="logo-img">
        <div class="cabecalho-texto">
            <span class="titulo">ETEC PRESIDENTE VARGAS</span>
            <span class="subtitulo">MATRÍCULA 1/2026</span>
        </div>
    </header>

    <main>
        <div id="cardNormal" class="card bg-azul">
            <div class="card-titulo">NORMAL</div>
            <div id="displayNormal" class="card-numero">0000</div>
        </div>
        <div id="cardPref" class="card bg-vermelho">
            <div class="card-titulo">PREFERENCIAL</div>
            <div id="displayPref" class="card-numero">P000</div>
        </div>
    </main>

    <div class="footer-container">
        <div class="historico-bar">
            ÚLTIMA CHAMADA: <span id="txtHistorico">--</span> às <span id="txtHora">--:--</span>
        </div>
        <div class="footer-msg">AGUARDE SUA SENHA SER CHAMADA NO PAINEL</div>
    </div>

    <audio id="somChamada" src="audio/chamada.wav"></audio>

    <script>
        const audio = document.getElementById('somChamada');
        
        function atualizarInfo(textoSenha) {
            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            document.getElementById('txtHistorico').innerText = textoSenha;
            document.getElementById('txtHora').innerText = horaFormatada;
            
            audio.play().catch(e => console.log("Som bloqueado até clique."));
        }

        db.ref('senhas/normal').on('value', (s) => {
            const val = s.val() || 0;
            const txt = val.toString().padStart(4, '0');
            const el = document.getElementById('displayNormal');
            
            if(el.innerText !== txt && el.innerText !== "0000") {
                atualizarInfo("NORMAL " + txt);
                document.getElementById('cardNormal').classList.add('destaque');
                document.getElementById('cardPref').classList.remove('destaque');
            }
            el.innerText = txt;
        });

        db.ref('senhas/preferencial').on('value', (s) => {
            const val = s.val() || 0;
            const txt = 'P' + val.toString().padStart(3, '0');
            const el = document.getElementById('displayPref');

            if(el.innerText !== txt && el.innerText !== "P000") {
                atualizarInfo("PREFERENCIAL " + txt);
                document.getElementById('cardPref').classList.add('destaque');
                document.getElementById('cardNormal').classList.remove('destaque');
            }
            el.innerText = txt;
        });

        document.body.addEventListener('click', () => console.log("Áudio ativo"));
    </script>
</body>
</html>
