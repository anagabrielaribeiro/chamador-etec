<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DE SENHAS - ETEC PRESIDENTE VARGAS</title>
    
    <style>
        /* --- CSS PURO (Sem Bootstrap) --- */
        
        /* Reset para garantir que não haja bordas brancas indesejadas */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            height: 100vh; /* Ocupa 100% da altura da tela */
            display: flex;
            flex-direction: column; /* Organiza: Cabeçalho em cima, Corpo no meio, Rodapé embaixo */
            overflow: hidden; /* Evita barras de rolagem */
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: white;
            height: 120px; /* Altura fixa */
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Joga Logo pra esquerda e Texto pra direita */
            border-bottom: 6px solid #b11116; /* Linha vermelha grossa */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .logo-img {
            height: 80px; /* Tamanho da logo */
            width: auto;
        }

        .cabecalho-texto {
            text-align: right;
        }

        .titulo {
            display: block;
            color: #b11116;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .subtitulo {
            display: block;
            color: #666;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* --- CORPO PRINCIPAL (CARTÕES) --- */
        main {
            flex: 1; /* Ocupa todo o espaço sobrando na tela */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Espaço entre os cartões */
            padding: 20px 40px;
        }

        .card {
            flex: 1; /* Cada cartão ocupa 50% do espaço */
            height: 80%; /* Altura do cartão relativa à tela */
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .bg-azul { background-color: #0056b3; background: linear-gradient(135deg, #0056b3 0%, #004494 100%); }
        .bg-vermelho { background-color: #d32f2f; background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); }

        .card-titulo {
            font-size: 3vw; /* Tamanho responsivo (3% da largura da tela) */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .card-numero {
            font-size: 14vw; /* Tamanho GIGANTE responsivo */
            font-weight: 900;
            line-height: 1;
            text-shadow: 5px 5px 15px rgba(0,0,0,0.4);
        }

        /* --- RODAPÉ --- */
        footer {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- STATUS DE CONEXÃO (Cantinho da tela) --- */
        .status-box {
            position: fixed;
            bottom: 10px;
            right: 15px;
            background: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #555;
            font-family: monospace;
        }

    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
</head>
<body>

    <header>
        <img src="img/etecpv.png" alt="Logo ETEC" class="logo-img">
        
        <div class="cabecalho-texto">
            <span class="titulo">ETEC PRESIDENTE VARGAS</span>
            <span class="subtitulo">MATRÍCULA 1/2026</span>
        </div>
    </header>

    <main>
        <div class="card bg-azul">
            <div class="card-titulo">NORMAL</div>
            <div id="displayNormal" class="card-numero">0000</div>
        </div>

        <div class="card bg-vermelho">
            <div class="card-titulo">PREFERENCIAL</div>
            <div id="displayPref" class="card-numero">P000</div>
        </div>
    </main>

    <footer>
        AGUARDE SUA SENHA SER CHAMADA NO PAINEL
    </footer>

    <div class="status-box">
        ● Sistema Online | Última chamada: <span id="horaUltima">--:--:--</span>
    </div>

    <audio id="somChamada" src="audio/chamada.wav"></audio>

    <script>
        // --- LÓGICA DO SISTEMA ---
        
        const audio = document.getElementById('somChamada');

        // Função segura para tocar áudio
        function tocarAudio() {
            // Tenta tocar. Se o navegador bloquear, avisa no console.
            audio.play().catch(e => console.log("Áudio aguardando interação do usuário."));
        }

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('horaUltima').innerText = agora.toLocaleTimeString();
        }

        // 1. Escuta Senha Normal
        db.ref('senhas/normal').on('value', (snapshot) => {
            const valor = snapshot.val() || 0;
            const textoFormatado = valor.toString().padStart(4, '0');
            const elemento = document.getElementById('displayNormal');

            // Verifica se mudou para tocar o som
            if(elemento.innerText !== textoFormatado && elemento.innerText !== "0000") {
                tocarAudio();
                atualizarRelogio();
            }
            elemento.innerText = textoFormatado;
        });

        // 2. Escuta Senha Preferencial
        db.ref('senhas/preferencial').on('value', (snapshot) => {
            const valor = snapshot.val() || 0;
            const textoFormatado = 'P' + valor.toString().padStart(3, '0');
            const elemento = document.getElementById('displayPref');

            if(elemento.innerText !== textoFormatado && elemento.innerText !== "P000") {
                tocarAudio();
                atualizarRelogio();
            }
            elemento.innerText = textoFormatado;
        });

        // Clique na tela para liberar o áudio (Exigência do Chrome/Edge)
        document.body.addEventListener('click', () => {
            console.log("Áudio liberado pelo usuário");
        });
    </script>
</body>
</html>
